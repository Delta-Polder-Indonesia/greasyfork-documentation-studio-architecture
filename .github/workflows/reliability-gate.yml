name: Reliability Gate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  reliability:
    runs-on: ubuntu-latest
    env:
      VITE_RUNTIME_ENV: ci
      CI: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Unit Tests
        run: npx vitest run

      - name: E2E Reliability
        run: npx playwright test --project=chromium

      - name: Validate Artifacts
        run: node tools/run-validation.mjs validate:artifacts

      - name: Validate Reliability
        run: node tools/run-validation.mjs validate:reliability

      - name: Validate Performance
        run: node tools/run-validation.mjs validate:performance

      - name: Validate Release
        run: node tools/run-validation.mjs validate:release

      - name: Upload Reliability Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: reliability-artifacts
          path: |
            reports/
            benchmarks/
            snapshots/
            release-checks/
