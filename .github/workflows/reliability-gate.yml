name: Reliability Gate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  reliability:
    runs-on: ubuntu-latest
    env:
      VITE_RUNTIME_ENV: ci
      CI: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Unit Tests
        run: npx vitest run

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: E2E Reliability
        run: npx playwright test --project=chromium
